<svg xmlns="http://www.w3.org/2000/svg" width="180" height="170" viewBox="0 0 180 170" role="img" aria-labelledby="title">
  <title id="title">A glowing microchip with data pulses flowing into it</title>
  <defs>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>

  <!-- floor: glow ring, circuit traces, nodes and incoming pulses (isometric floor plane) -->
  <g transform="matrix(0.6495 0.375 -0.6495 0.375 90 110)">
    <circle r="34" fill="#22d3ee" fill-opacity="0.12"/>
    <circle r="30" fill="none" stroke="#22d3ee" stroke-width="1.5">
      <animate attributeName="r" values="26;46" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <g fill="none" stroke="#06b6d4" stroke-width="2.4" stroke-opacity="0.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M-30 20H-55V55"/>
      <path d="M20 -30V-55H55"/>
      <path d="M0 30V62H30"/>
      <path d="M30 0H62V30"/>
    </g>
    <g fill="#10b981">
      <circle cx="-55" cy="55" r="9" fill-opacity="0.25"/><circle cx="-55" cy="55" r="4.5"/>
      <circle cx="55" cy="-55" r="9" fill-opacity="0.25"/><circle cx="55" cy="-55" r="4.5"/>
      <circle cx="30" cy="62" r="9" fill-opacity="0.25"/><circle cx="30" cy="62" r="4.5"/>
      <circle cx="62" cy="30" r="9" fill-opacity="0.25"/><circle cx="62" cy="30" r="4.5"/>
    </g>
    <g fill="#22d3ee" filter="url(#glow)">
      <circle r="3.5"><animateMotion dur="1.8s" repeatCount="indefinite" path="M-55 55V20H-30"/></circle>
      <circle r="3.5"><animateMotion dur="1.8s" begin="-0.45s" repeatCount="indefinite" path="M55 -55V-30H20"/></circle>
      <circle r="3.5"><animateMotion dur="1.8s" begin="-0.9s" repeatCount="indefinite" path="M30 62H0V30"/></circle>
      <circle r="3.5"><animateMotion dur="1.8s" begin="-1.35s" repeatCount="indefinite" path="M62 30V0H30"/></circle>
    </g>
  </g>

  <rect x="80" y="88" width="20" height="22" fill="url(#beam)"/>

  <!-- floating chip -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0" dur="3s" repeatCount="indefinite"/>

    <!-- pins on the two back edges (in the chip's top plane) -->
    <g transform="matrix(0.6495 0.375 -0.6495 0.375 90 64)" fill="#a5b4fc">
      <rect x="-37" y="-20.5" width="7" height="5" rx="1"/>
      <rect x="-37" y="-8.5" width="7" height="5" rx="1"/>
      <rect x="-37" y="3.5" width="7" height="5" rx="1"/>
      <rect x="-37" y="15.5" width="7" height="5" rx="1"/>
      <rect x="-20.5" y="-37" width="5" height="7" rx="1"/>
      <rect x="-8.5" y="-37" width="5" height="7" rx="1"/>
      <rect x="3.5" y="-37" width="5" height="7" rx="1"/>
      <rect x="15.5" y="-37" width="5" height="7" rx="1"/>
    </g>

    <!-- body sides and front legs -->
    <polygon points="51.03,64 90,86.5 90,93.5 51.03,71" fill="#4c1d95"/>
    <polygon points="90,86.5 128.97,64 128.97,71 90,93.5" fill="#6d28d9"/>
    <g stroke="#a5b4fc" stroke-width="2.2" stroke-linecap="round">
      <path d="M58.8 75.5v5M66.6 80v5M74.4 84.5v5M82.2 89v5"/>
      <path d="M97.8 89v5M105.6 84.5v5M113.4 80v5M121.2 75.5v5"/>
    </g>

    <!-- top face with glowing core -->
    <g transform="matrix(0.6495 0.375 -0.6495 0.375 90 64)">
      <rect x="-30" y="-30" width="60" height="60" rx="3" fill="#312e81" stroke="#a78bfa" stroke-width="1.6"/>
      <circle cx="-22" cy="-22" r="2.5" fill="#c4b5fd"/>
      <rect x="-17" y="-17" width="34" height="34" rx="3" fill="url(#core)" filter="url(#glow)">
        <animate attributeName="opacity" values="0.55;1;0.55" dur="1.8s" repeatCount="indefinite"/>
      </rect>
      <path d="M-17 -6H17M-17 6H17M-6 -17V17M6 -17V17" stroke="#312e81" stroke-opacity="0.55" stroke-width="1.2"/>
    </g>

    <!-- data bits rising off the chip -->
    <g fill="#22d3ee">
      <rect x="82" y="56" width="4" height="4" rx="1">
        <animateTransform attributeName="transform" type="translate" values="0 0;0 -44" dur="2.4s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;1;0" dur="2.4s" repeatCount="indefinite"/>
      </rect>
      <rect x="90" y="56" width="4" height="4" rx="1">
        <animateTransform attributeName="transform" type="translate" values="0 0;0 -44" dur="2.4s" begin="-0.8s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;1;0" dur="2.4s" begin="-0.8s" repeatCount="indefinite"/>
      </rect>
      <rect x="98" y="56" width="4" height="4" rx="1" fill="#a78bfa">
        <animateTransform attributeName="transform" type="translate" values="0 0;0 -44" dur="2.4s" begin="-1.6s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;1;0" dur="2.4s" begin="-1.6s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>
</svg>
